version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  # PostgREST - Auto-generates REST API from PostgreSQL
  api:
    image: postgrest/postgrest:latest
    container_name: local-postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Disable JWT requirement for anonymous access
      PGRST_JWT_SECRET: "reallylongsecretkeythatisatleast32characterslong"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
